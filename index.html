<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#36383d;
    color:#eeeeee;
    font-family:Arial,sans-serif;
}

.container{
    width:90%;
    max-width:650px;
    margin:auto;
    padding:55px 0 70px;
}

header{
    text-align:center;
    margin-bottom:35px;
}

.date{
    color:#b8bbc1;
    font-size:12px;
    letter-spacing:2px;
    line-height:1.8;
}

h1{
    font-family:Georgia,serif;
    font-size:40px;
    font-weight:normal;
    margin:16px 0;
}

.intro{
    color:#c9cbd0;
    font-size:14px;
    line-height:1.8;
}

.doors{
    display:grid;
    gap:13px;
}

.door{
    width:100%;
    padding:19px;
    border-radius:18px;
    border:1px solid #55585f;
    background:#414349;
    color:#eeeeee;
    text-align:left;
    cursor:pointer;
    font-size:14px;
    transition:.2s;
}

.door:hover{
    background:#494b51;
    transform:translateY(-2px);
}

.hint{
    display:block;
    margin-top:7px;
    color:#aeb1b7;
    font-size:11px;
}

.message{
    display:none;
    margin-top:22px;
    padding:25px;
    border-radius:20px;
    background:#414349;
    border:1px solid #55585f;
    line-height:2;
    font-size:14px;
    white-space:pre-line;
}

.message.show{
    display:block;
}

.message-title{
    font-family:Georgia,serif;
    font-size:26px;
    margin-bottom:15px;
}

.close{
    margin-top:18px;
    padding:7px 12px;
    border:0;
    background:transparent;
    color:#aaaeb5;
    cursor:pointer;
}

footer{
    text-align:center;
    margin-top:45px;
    color:#777b82;
    font-size:11px;
}

</style>
</head>
