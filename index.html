 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>18.08.2025 — 18.08.2026 — 18.08.♾️</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#36383d;
    color:#eeeeee;
    font-family:Arial,sans-serif;
}

.container{
    width:90%;
    max-width:650px;
    margin:auto;
    padding:55px 0 70px;
}

header{
    text-align:center;
    margin-bottom:35px;
}

.date{
    color:#b8bbc1;
    font-size:12px;
    letter-spacing:2px;
    line-height:1.8;
}

h1{
    font-family:Georgia,serif;
    font-size:40px;
    font-weight:normal;
    margin:16px 0;
}

.intro{
    color:#c9cbd0;
    font-size:14px;
    line-height:1.8;
}

.doors{
    display:grid;
    gap:13px;
}

.door{
    width:100%;
    padding:19px;
    border-radius:18px;
    border:1px solid #55585f;
    background:#414349;
    color:#eeeeee;
    text-align:left;
    cursor:pointer;
    font-size:14px;
    transition:.2s;
}

.door:hover{
    background:#494b51;
    transform:translateY(-2px);
}

.hint{
    display:block;
    margin-top:7px;
    color:#aeb1b7;
    font-size:11px;
}

.message{
    display:none;
    margin-top:22px;
    padding:25px;
    border-radius:20px;
    background:#414349;
    border:1px solid #55585f;
    line-height:2;
    font-size:14px;
    white-space:pre-line;
}

.message.show{
    display:block;
}

.message-title{
    font-family:Georgia,serif;
    font-size:26px;
    margin-bottom:15px;
}

.close{
    margin-top:18px;
    padding:7px 12px;
    border:0;
    background:transparent;
    color:#aaaeb5;
    cursor:pointer;
}

footer{
    text-align:center;
    margin-top:45px;
    color:#777b82;
    font-size:11px;
}

</style>
</head>

<body>

<div class="container">

<header>

<div class="date">
18.08.2025 — 18.08.2026 — 18.08.♾️
</div>

<h1>
one year of us 🍁🩶
</h1>

<div class="intro">
There are a few things I wanted you to have.
<br>
Open whatever feels right, whenever it feels right.
</div>

</header>

<div class="doors">

<button class="door" onclick="openMessage('happy')">
🩶 Open when you're happy
<span class="hint">لما تكون مبسوط</span>
</button>

<button class="door" onclick="openMessage('miss')">
🍁 Open when you miss me
<span class="hint">لما تشتاق</span>
</button>

<button class="door" onclick="openMessage('sleep')">
🌙 Open when you can't sleep
<span class="hint">لما ما تقدر تنام</span>
</button>

<button class="door" onclick="openMessage('laugh')">
😂 Open when you need to laugh
<span class="hint">لما تحتاج تضحك</span>
</button>

<button class="door" onclick="openMessage('reminder')">
🤍 Open when you need a reminder
<span class="hint">لما تحتاج تتذكر شيء</span>
</button>

<button class="door" onclick="openMessage('talk')">
💬 Open when you feel like talking to me
<span class="hint">لما تحس بدك تحكي معي</span>
</button>

<button class="door" onclick="openFuture()">
🔒 Open on 18.08.2027
<span class="hint">this one has to wait.</span>
</button>

</div>

<div id="message" class="message">

<div id="messageTitle" class="message-title"></div>

<div id="messageText"></div>

<button class="close" onclick="closeMessage()">
close ×
</button>

</div>

<footer>
made for one very specific person 🍁
</footer>

</div>

sleep: {
title:"Open when you can't sleep 🌙",

laugh: {

وخلص كلخرا.

وانتبه ع حالك .🩶`
},

talk: {
title:"Open when you feel like talking to me 💬",
text:`إذا وصلت لهون معناته يمكن في شيء نفسك تحكيه.

function openMessage(type){

document.getElementById("messageTitle").innerText =
messages[type].title;

document.getElementById("messageText").innerText =
messages[type].text;

document.getElementById("message").classList.add("show");

document.getElementById("message").scrollIntoView({
behavior:"smooth"
});

}

function openFuture(){

const unlockDate =
new Date("2027-08-18T00:00:00");

const today =
new Date();

let title;
let text;

if(today < unlockDate){

title = "Not yet. 🔒";

text = `Come back on 18.08.2027. 🍁🩶

Some things are better when you wait for them.

(like me 😏)`;

}else{

title = "18.08.2027 🍁🩶";

text = `إذا قدرت تفتح هاظ الباب معناته وصلنا لـ 18.08.2027.

سنة ثانية مرت.

ويمكن الغريب إنه الوقت يمشي بسرعة
بس بعض التفاصيل تظل كأنها صارت امبارح.

مش عارفة وين كنا وقت ما كتبت هالكلام
ولا كيف كانت أيامنا
ولا شو الأشياء اللي تغيرت بين التاريخين.

بس بعرف اشي واحد:

إنه في أشياء ما كانت مجرد أيام وعدّت.

سهر،

ورح تكون السنة الثانية النا

إن كنا لسا مع بعض
أو الدنيا فرقتنا لا سمح الله.

وأتمنى إنه الأيام كانت لطيفة عليك
وإنك وصلت لأشياء كنت تتمنى توصلها.

وأتمنى مهما تغيرت الأشياء
تظل تتذكر إنه في شخص كان يتمنالك
ورح يضل يتمنى الخير من قلبه
حتى بالأيام اللي ما كان يعرف كيف يعبر عنها 🫀

يمكن ما عندي كلام مرتب لكل شيء
بس عندي امتنان لكل اللحظات اللي كانت بيننا.

للسنة اللي راحت
ولكل تفصيلة صغيرة خلتها مختلفة.

وإذا رجعنا نقرأ هالكلام بعد سنوات

بس عادي.

بعض الأشياء تستاهل تنكتب.

18.08.2025 — 18.08.2027 — 18.08.♾️

وانتبه ع حالك .🩶🫆

U’r Judy🍁`;
}

document.getElementById("messageTitle").innerText = title;

document.getElementById("messageText").innerText = text;

document.getElementById("message").classList.add("show");

document.getElementById("message").scrollIntoView({
behavior:"smooth"
});

}

function closeMessage(){

document.getElementById("message").classList.remove("show");

}

</script>

</body>
</html>
