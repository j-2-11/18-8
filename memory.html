<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صندوق الذكريات</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    background: #f9dce8;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #b56f8d;
}

.album {
    width: 100%;
    max-width: 650px;
    padding: 22px;
    text-align: center;
}

.photo-box {
    position: relative;
    width: 100%;
}

.photo {
    width: 100%;
    max-height: 72vh;
    object-fit: contain;
    border-radius: 18px;
    cursor: zoom-in;
    display: block;
}

.controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 22px;
}

button {
    border: 1px solid rgba(255,255,255,.8);
    background: rgba(255,255,255,.4);
    color: #a65f7e;
    font-size: 25px;
    border-radius: 14px;
    padding: 8px 22px;
    cursor: pointer;
}

.counter {
    font-size: 16px;
    direction: ltr;
}

#zoom {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(30,20,25,.95);
    justify-content: center;
    align-items: center;
    z-index: 10;
    padding: 12px;
}

#zoom img {
    max-width: 100%;
    max-height: 95vh;
    object-fit: contain;
}

</style>
</head>

<body>

<div class="album">
    <div class="photo-box">
        <img id="photo" class="photo" alt="ذكرى">
    </div>

    <div class="controls">
        <button onclick="change(-1)">❯</button>
        <span class="counter" id="counter"></span>
        <button onclick="change(1)">❮</button>
    </div>
</div>

<div id="zoom" onclick="this.style.display='none'">
    <img id="zoomPhoto" alt="صورة مكبرة">
</div>

<script>
const folder = "%E2%80%8F%20%20memory-images/";

const images = Array.from({length: 28}, (_, i) =>
    folder + `memory-${String(i + 1).padStart(2, '0')}.jpeg`
);

let current = 0;

const photo = document.getElementById("photo");
const counter = document.getElementById("counter");

function show() {
    photo.src = images[current];
    counter.textContent =
        String(current + 1).padStart(2, "0") +
        " / " + String(images.length).padStart(2, "0");
}

function change(direction) {
    current = (current + direction + images.length) % images.length;
    show();
}

photo.onclick = function() {
    document.getElementById("zoomPhoto").src = photo.src;
    document.getElementById("zoom").style.display = "flex";
};

let startX = 0;

photo.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
});

photo.addEventListener("touchend", e => {
    let difference = e.changedTouches[0].clientX - startX;
    if (Math.abs(difference) > 45) {
        change(difference > 0 ? 1 : -1);
    }
});

show();
</script>

</body>
</html>
